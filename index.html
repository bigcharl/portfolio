<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">    
    <title>Redirecting...</title>
</head>
<body>
  <script>
    const lang = navigator.language.toLowerCase()
    
    if (lang.includes("pt")) {
        window.location.href = "/portfolio/pt/"
    } else {
        window.location.href = "/portfolio/en/"
    }
  </script>
</body>
</html>
